services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: propagent
      POSTGRES_PASSWORD: propagent
      POSTGRES_DB: propagent
    ports:
      - "5432:5432"
    volumes:
      - propagent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propagent -d propagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://propagent:propagent@db:5432/propagent
      MAX_UPLOAD_MB: 100
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  propagent_pg:
